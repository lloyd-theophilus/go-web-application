name: CI Workflow

# Controls when the workflow will run
on:
  push:
    branches:
      - main
# Pathsto ignore when updating values and  do not want to triger the pipeline
    paths-ignore:
      - 'README.md'
      - 'helm/**'
  pull_request:
    branches:
      - main

# Define environment variables for the workflow
#env:
#  DOCKER_IMAGE: lloyddigital/go-web-app
#  DOCKER_TAG: ${{ github.sha }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go 1.22
      uses: actions/setup-go@v2
      with:
        go-version: '1.22'

  #  - name: Install dependencies
  #   run: go mod download

    - name: Run Tests
      run: go test ./...
      
# Run a static code analysis
    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v6
      with:
        version: v1.56.2
    - name: Setup up Docker Buildx
      uses: docker/setup-buildx-action@v1

    - name: Login to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and Push docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: ${{secrets.DOCKERHUB_USERNAME}}/go-web-application:${{github.run_id}}

