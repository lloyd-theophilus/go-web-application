#Updating the helm file with new image tag
update-newtag-in-helm-chart:
  runs-on: ubuntu-latest

  needs: push

  steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.Token }}

    - name: Update tag in Helm chart
      run: |
        sed -i 's/tag: .*/tag: "${{github.run_id}}"/' helm/go-app-chart/values.yaml

    - name: Commit and push changes
      run: |
        git config --global user.email 'lloydtheophilus@gmail.com'
        git config --global user.name 'lloyd-theophilus'
        git add helm/go-app-chart/values.yaml
        git commit -m 'Update tag in Helm chart'
        git push 
     
