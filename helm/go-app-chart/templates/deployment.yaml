apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: go-web
  name: go-web-application
  labels: 
    app: go-web-application
spec:
  replicas: 2
  selector:
    matchLabels:                
      app: go-web-application    
  template:
    metadata:
      labels:
        app: go-web-application  
    spec:
      containers:
      - name: go-web-application
        image: lloyddigital/go-web-app:{{ .Values.image.tag }}  # Removed spaces around placeholder
        ports:
        - containerPort: 8080
        resources:
          requests:
            memory: "128Mi"       
            cpu: "250m"
          limits:
            memory: "256Mi"       
            cpu: "500m"
